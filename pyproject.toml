[project]
name = "nhl-scoreboard"
version = "0.1.0"
description = "Standalone LED matrix scoreboard for Raspberry Pi — NHL first, pluggable for more"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pillow>=10.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "astral>=3.2",
]

[project.optional-dependencies]
emulator = ["rgbmatrixemulator>=0.14.0"]
pi = ["rgbmatrix ; python_full_version >= '3.13' and platform_machine == 'aarch64'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]
build = ["cairosvg>=2.7"]

[project.scripts]
scoreboard = "scoreboard.__main__:main"

[project.entry-points."scoreboard.boards"]
clock = "scoreboard.boards.clock:ClockBoard"
splash = "scoreboard.boards.splash:SplashBoard"
blank = "scoreboard.boards.blank:BlankBoard"
"nhl.game" = "scoreboard.nhl.boards.game:GameBoard"
"nhl.ticker" = "scoreboard.nhl.boards.ticker:TickerBoard"
"nhl.standings" = "scoreboard.nhl.boards.standings:StandingsBoard"
"nhl.team_summary" = "scoreboard.nhl.boards.team_summary:TeamSummaryBoard"
"nhl.goal" = "scoreboard.nhl.boards.events:GoalBoard"
"nhl.penalty" = "scoreboard.nhl.boards.events:PenaltyBoard"

[project.entry-points."scoreboard.sources"]
nhl = "scoreboard.nhl.source:NhlSource"

[project.entry-points."scoreboard.detectors"]
nhl = "scoreboard.nhl.events:detect_main_event"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scoreboard"]

[tool.uv.sources]
rgbmatrix = { url = "https://github.com/falkyre/nhl-led-scoreboard-img/releases/download/latest-trixie/rgbmatrix-0.0.1-cp313-cp313-linux_aarch64.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "E702", "RUF005", "RUF059", "RUF046", "SIM102", "SIM105", "UP042", "B905"]
