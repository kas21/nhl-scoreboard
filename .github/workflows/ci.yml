# Lint and the fast suite on every push and pull request. The deploy path is "push to main,
# then Update on the Pi", so this is what stands between a broken commit and the panel.
#
# The golden frames are pinned on macOS: FreeType in the manylinux Pillow wheel rasterises
# TrueType a little differently (39 of 237 frames, every board with a TTF score or clock),
# so on Linux they run as information, not as a gate. The diff sheets are kept as an artifact.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check scoreboard tests
      - name: Test
        run: uv run pytest -q --ignore=tests/test_golden.py
      - name: Golden frames (informational; pinned on macOS)
        continue-on-error: true
        run: uv run pytest -q tests/test_golden.py
      - name: Keep the golden diff sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-sheets
          path: tests/golden/_failed
          if-no-files-found: ignore
